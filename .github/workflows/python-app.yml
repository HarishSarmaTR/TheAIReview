name: Build AI Review Tool

on:
  push:
    branches: [ "main" ]
    tags:
      - 'v*'  # Push events to matching v*, i.e. v1.0, v20.15.10
  workflow_dispatch:  # Allow manual triggering

jobs:
  build:
    runs-on: windows-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v3
      
    - name: Set up Python 3.10
      uses: actions/setup-python@v3
      with:
        python-version: "3.10"
        
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install pyinstaller
        pip install requests cryptography pillow PyGithub customtkinter
        # Install any other required packages
        if (Test-Path requirements.txt) {
          pip install -r requirements.txt
        }
      
    - name: Basic syntax check
      run: |
        # Run a basic syntax check on all Python files
        Get-ChildItem -Path AIReview -Filter "*.py" -Recurse | ForEach-Object {
            Write-Host "Checking $($_.FullName)"
            python -m py_compile $_.FullName
        }
      
    - name: Clean workspace
      run: |
        # Remove build artifacts and temporary files
        Write-Host "Cleaning up workspace..."
        
        # Remove PyInstaller artifacts and temporary directories
        if (Test-Path -Path "dist") {
            Remove-Item -Path "dist" -Recurse -Force
        }
        if (Test-Path -Path "build") {
            Remove-Item -Path "build" -Recurse -Force
        }
        if (Test-Path -Path "__pycache__") {
            Remove-Item -Path "__pycache__" -Recurse -Force
        }
        if (Test-Path -Path "AIReview/__pycache__") {
            Remove-Item -Path "AIReview/__pycache__" -Recurse -Force
        }
        if (Test-Path -Path "AIReview/dist") {
            Remove-Item -Path "AIReview/dist" -Recurse -Force
        }
        if (Test-Path -Path "AIReview/build") {
            Remove-Item -Path "AIReview/build" -Recurse -Force
        }
        
        # Remove spec files
        Get-ChildItem -Path "*.spec" | ForEach-Object {
            Write-Host "Removing $($_.FullName)"
            Remove-Item -Path $_.FullName -Force
        }
        
        # Remove any test/temporary files
        if (Test-Path -Path "test_api.bat") {
            Remove-Item -Path "test_api.bat" -Force
        }
        
        Write-Host "Workspace cleaned!"
        
    - name: Create backup folder structure
      run: |
        # Create dist and backup folders if they don't exist
        $distFolder = Join-Path (Get-Location) "dist"
        $backupFolder = Join-Path $distFolder "backup"
        
        if (-not (Test-Path -Path $distFolder)) {
            New-Item -Path $distFolder -ItemType Directory -Force
        }
        
        if (-not (Test-Path -Path $backupFolder)) {
            New-Item -Path $backupFolder -ItemType Directory -Force
        }
      
    - name: Backup existing executable
      run: |
        # Check if there's an existing executable to back up
        $exePath = "dist/AIReviewTool_V2.0.0.exe"
        $backupFolder = "dist/backup"
        
        if (Test-Path -Path $exePath) {
            $timestamp = Get-Date -Format "yyyyMMdd-HHmmss"
            $backupName = "AIReviewTool_backup_${timestamp}.exe"
            $backupPath = Join-Path $backupFolder $backupName
            
            Write-Host "Backing up existing executable to $backupPath"
            Copy-Item -Path $exePath -Destination $backupPath -Force
            Write-Host "Backup successful!"
            
            # Only keep the most recent backup
            $backupFiles = Get-ChildItem -Path $backupFolder -Filter "AIReviewTool_backup_*.exe" | 
                           Sort-Object LastWriteTime -Descending | 
                           Select-Object -Skip 1
            
            foreach ($file in $backupFiles) {
                Write-Host "Removing older backup: $($file.Name)"
                Remove-Item -Path $file.FullName -Force
            }
        } else {
            Write-Host "No existing executable found, skipping backup."
        }
    
    - name: Prepare theme files
      run: |
        # Ensure theme file is accessible in root directory
        Write-Host "Ensuring theme files are accessible..."
        if (-not (Test-Path -Path "blue.json")) {
            Write-Host "Warning: blue.json not found in root directory!"
            # Create a minimal theme file if it doesn't exist
            Write-Host "Creating minimal theme file..."
            '{"CTk": {"fg_color": ["#F0F0F0", "#212121"]}}' | Out-File -FilePath "blue.json" -Encoding UTF8
        } else {
            Write-Host "blue.json found in root directory"
        }
    
    - name: Prepare resources
      run: |
        # Copy the icon to the root directory for easier access
        Write-Host "Copying icon file to root directory..."
        if (-not (Test-Path -Path "ai.ico")) {
            Copy-Item -Path "images/ai.ico" -Destination "ai.ico" -Force
            Write-Host "Copied icon file to root directory"
        }
    
    - name: Build executables with PyInstaller
      run: |
        # Build the latest version (V2.0.0)
        Write-Host "Building AIReviewTool_V2.0.0.exe..."
        pyinstaller --name "AIReviewTool_V2.0.0" --onefile --windowed --icon="ai.ico" --add-data "images/ai.ico;images" --add-data "ai.ico;." --add-data "images/TR.png;images" --add-data "images/logo.png;images" --add-data "blue.json;AIReview" --add-data "blue.json;." AIReview/AIReview.py
        
        # Verify the V2.0.0 executable was created
        if (Test-Path -Path "dist/AIReviewTool_V2.0.0.exe") {
            Write-Host "V2.0.0 executable successfully created at dist/AIReviewTool_V2.0.0.exe"
            
            # Ensure theme file is also in the dist folder
            if (-not (Test-Path -Path "dist/blue.json")) {
                Copy-Item -Path "blue.json" -Destination "dist/blue.json" -Force
                Write-Host "Copied theme file to dist directory"
            }
        } else {
            Write-Host "ERROR: V2.0.0 executable not found at dist/AIReviewTool_V2.0.0.exe"
            exit 1
        }
        
        # Build the v1.0.1 version
        Write-Host "Building AIReviewTool_v1.0.1.exe..."
        pyinstaller --name "AIReviewTool_v1.0.1" --onefile --windowed --icon="ai.ico" --add-data "images/ai.ico;images" --add-data "ai.ico;." --add-data "images/TR.png;images" --add-data "images/logo.png;images" --add-data "images/bot.JPG;images" AIReview/AIReview_v1.0.1.py
        
        # Verify the v1.0.1 executable was created
        if (Test-Path -Path "dist/AIReviewTool_v1.0.1.exe") {
            Write-Host "v1.0.1 executable successfully created at dist/AIReviewTool_v1.0.1.exe"
        } else {
            Write-Host "ERROR: v1.0.1 executable not found at dist/AIReviewTool_v1.0.1.exe"
            exit 1
        }
      
    - name: Zip the executables
      run: |
        # Create ZIP files with the executables and any necessary files
        cd dist
        
        # Zip V2.0.0 (latest version)
        if (Test-Path -Path "AIReviewTool_V2.0.0.exe") {
            # Include the exe and theme file in the archive
            Copy-Item -Path "..\AIReview\blue.json" -Destination "blue.json" -Force -ErrorAction SilentlyContinue
            Compress-Archive -Path @("AIReviewTool_V2.0.0.exe", "blue.json") -DestinationPath AIReviewTool_V2.0.0.zip -Force
            
            # Verify the ZIP file was created
            if (Test-Path -Path "AIReviewTool_V2.0.0.zip") {
                Write-Host "V2.0.0 ZIP file successfully created"
            } else {
                Write-Host "ERROR: Failed to create V2.0.0 ZIP file"
                exit 1
            }
        } else {
            Write-Host "ERROR: V2.0.0 executable not found in dist folder!"
            exit 1
        }
        
        # Zip v1.0.1 (older version)
        if (Test-Path -Path "AIReviewTool_v1.0.1.exe") {
            Compress-Archive -Path "AIReviewTool_v1.0.1.exe" -DestinationPath AIReviewTool_v1.0.1.zip -Force
            
            # Verify the ZIP file was created
            if (Test-Path -Path "AIReviewTool_v1.0.1.zip") {
                Write-Host "v1.0.1 ZIP file successfully created"
            } else {
                Write-Host "ERROR: Failed to create v1.0.1 ZIP file"
                exit 1
            }
        } else {
            Write-Host "ERROR: v1.0.1 executable not found in dist folder!"
            exit 1
        }
        
    - name: Post-build cleanup
      run: |
        # Remove build artifacts after zipping to reduce storage usage
        Write-Host "Cleaning up build artifacts..."
        if (Test-Path -Path "build") {
            Remove-Item -Path "build" -Recurse -Force
            Write-Host "Removed build directory"
        }
        
        # Remove PyInstaller temp files
        Get-ChildItem -Path "." -Filter "*.spec" | ForEach-Object {
            Remove-Item -Path $_.FullName -Force
            Write-Host "Removed spec file: $($_.Name)"
        }
        
        # Keep only the dist folder with our final executable and zip
        
    - name: Upload V2.0.0 artifact
      uses: actions/upload-artifact@v4
      with:
        name: AIReviewTool_V2.0.0
        path: dist/AIReviewTool_V2.0.0.zip
        
    - name: Upload v1.0.1 artifact
      uses: actions/upload-artifact@v4
      with:
        name: AIReviewTool_v1.0.1
        path: dist/AIReviewTool_v1.0.1.zip
        
    - name: Create Release
      id: create_release
      if: startsWith(github.ref, 'refs/tags/')
      uses: softprops/action-gh-release@v1
      with:
        files: |
          dist/AIReviewTool_V2.0.0.zip
          dist/AIReviewTool_v1.0.1.zip
        name: "AI Review Tool Release"
        draft: false
        prerelease: false
        generate_release_notes: true
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
